<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — Beauty Store POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <h2>🔒 Change Password</h2>
            <p>You must set a new secure password before continuing.</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="password-alert" class="alert-message" style="display: none;"></div>

        <form id="password-form">
            <div class="form-group">
                <label for="current-password">Current Password *</label>
                <input 
                    type="password" 
                    id="current-password" 
                    class="form-control" 
                    placeholder="Enter current password" 
                    required 
                    autocomplete="current-password"
                >
            </div>

            <div class="form-group">
                <label for="new-password">New Password *</label>
                <input 
                    type="password" 
                    id="new-password" 
                    class="form-control" 
                    placeholder="At least 6 characters" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm New Password *</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    class="form-control" 
                    placeholder="Re-enter new password" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
                Update Password
            </button>
        </form>
    </div>

    <!-- Controller JS -->
    <script src="password.js"></script>
</body>
</html>
