<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Shop System - Restock Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h1>🛍️ BEAUTY SHOP SYSTEM</h1>
        <div>👤 Welcome, Helen</div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-category">Main</div>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="add_product.html">➕ Add Product</a>
            <a href="restock_product.html" class="active">📦 Restock Product</a>
            <a href="index.html">🛒 Record Sale</a>
            <a href="inventory.html">📦 Master Inventory</a>

            <div class="sidebar-category">Reports</div>
            <a href="view_sales.html">📄 View Sales</a>
            <a href="debts.html">⏰ Outstanding Debts</a>
            <a href="low_stock.html">⚠️ Low Stock</a>
        </aside>

        <main class="main-content">
            <div class="header-title">
                <h2>📦 Restock Inventory</h2>
                <p>Update quantities for existing products. Values recalculate dynamically.</p>
            </div>

            <div class="content-container">
                <section class="card">
                    <h3>Restock Details</h3>
                    
                    <form id="restockForm">
                        <div class="form-grid">
                            <div>
                                <div class="form-group">
                                    <label for="existingProduct">Select Product</label>
                                    <select id="existingProduct" class="form-control" required>
                                        </select>
                                </div>

                                <div class="form-row" style="display: flex; gap: 15px;">
                                    <div class="form-group" style="flex: 1;">
                                        <label>Current Stock</label>
                                        <input type="text" id="currentStockDisplay" class="form-control" value="0" readonly style="background-color: #f3f4f6;">
                                    </div>
                                    <div class="form-group" style="flex: 1;">
                                        <label for="quantityToAdd">Quantity Arrived</label>
                                        <input type="number" id="quantityToAdd" class="form-control" placeholder="0" min="1" required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>New Total Stock</label>
                                    <input type="text" id="newTotalStock" class="form-control" value="0" readonly style="background-color: #e0f2fe; color: #0369a1; font-weight: bold;">
                                </div>
                            </div>

                            <div>
                                <div class="form-group">
                                    <label for="unitBuyingPrice">Unit Buying Price (Ksh)</label>
                                    <input type="number" id="unitBuyingPrice" class="form-control" min="0" required>
                                </div>

                                <div class="form-group">
                                    <label>Total Restock Cost</label>
                                    <input type="text" id="totalRestockCost" class="form-control" value="0 Ksh" readonly style="background-color: #f3f4f6;">
                                </div>

                                <div class="form-group">
                                    <label for="supplierDetails">Supplier / Notes (Optional)</label>
                                    <input type="text" id="supplierDetails" class="form-control" placeholder="e.g., Supplier delivery batch">
                                </div>
                            </div>
                        </div>

                        <div class="actions" style="margin-top: 30px;">
                            <button type="button" class="btn btn-secondary" id="clearRestockBtn">Clear</button>
                            <button type="submit" class="btn btn-primary">Update Inventory</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script>
        // DOM Elements
        const productSelect = document.getElementById('existingProduct');
        const currentStockDisplay = document.getElementById('currentStockDisplay');
        const quantityToAdd = document.getElementById('quantityToAdd');
        const newTotalStock = document.getElementById('newTotalStock');
        const unitBuyingPrice = document.getElementById('unitBuyingPrice');
        const totalRestockCost = document.getElementById('totalRestockCost');
        const form = document.getElementById('restockForm');
        const clearBtn = document.getElementById('clearRestockBtn');

        let inventory = [];

        // Load inventory array items from local storage database
        function loadInventory() {
            const stored = localStorage.getItem('beauty_inventory');
            inventory = stored ? JSON.parse(stored) : [];
            
            // Rebuild selection element contents dynamically
            productSelect.innerHTML = '<option value="" disabled selected>-- Choose a product --</option>';
            inventory.forEach(product => {
                const opt = document.createElement('option');
                opt.value = product.id;
                opt.textContent = `${product.brand} - ${product.name} (${product.category})`;
                productSelect.appendChild(opt);
            });
        }

        // Dropdown selection change rule logic execution
        productSelect.addEventListener('change', () => {
            const matchedProduct = inventory.find(p => p.id === productSelect.value);
            if (matchedProduct) {
                currentStockDisplay.value = matchedProduct.stock;
                unitBuyingPrice.value = matchedProduct.buyingPrice;
                quantityToAdd.value = ''; // Reset entry on shift
                calculateTotals();
            }
        });

        // Real-time automatic calculations function
        function calculateTotals() {
            const currentStock = parseInt(currentStockDisplay.value) || 0;
            const addedQty = parseInt(quantityToAdd.value) || 0;
            const unitPrice = parseFloat(unitBuyingPrice.value) || 0;

            // Compute automatic mathematical answers
            newTotalStock.value = currentStock + addedQty;
            const computedCost = addedQty * unitPrice;
            totalRestockCost.value = computedCost.toLocaleString() + ' Ksh';
        }

        quantityToAdd.addEventListener('input', calculateTotals);
        unitBuyingPrice.addEventListener('input', calculateTotals);

        // Handle updates on active inventory records array matrix
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const prodId = productSelect.value;
            const targetIndex = inventory.findIndex(p => p.id === prodId);

            if (targetIndex !== -1) {
                const addedQty = parseInt(quantityToAdd.value) || 0;
                const updatedCostPrice = parseFloat(unitBuyingPrice.value) || 0;

                // Adjust array state variables directly
                inventory[targetIndex].stock += addedQty;
                inventory[targetIndex].buyingPrice = updatedCostPrice;

                // Commit back storage string transformations
                localStorage.setItem('beauty_inventory', JSON.stringify(inventory));

                alert(`📦 Inventory Saved!\nUpdated stock for: ${inventory[targetIndex].name}\nNew Stock Level: ${inventory[targetIndex].stock} units.`);
                
                form.reset();
                resetDisplays();
                loadInventory();
            }
        });

        function resetDisplays() {
            currentStockDisplay.value = "0";
            newTotalStock.value = "0";
            totalRestockCost.value = "0 Ksh";
        }

        clearBtn.addEventListener('click', () => {
            form.reset();
            resetDisplays();
        });

        // Run routine setup on execution stack entry loop
        loadInventory();
    </script>
</body>
</html>
