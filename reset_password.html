<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Shop POS - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f3f4f6; }
        .reset-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .masked-badge { background-color: #eff6ff; color: #1d4ed8; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; margin: 15px 0; border: 1px solid #bfdbfe; word-break: break-all; }
    </style>
</head>
<body>

<div class="reset-card">
    <h2>🔑 Account Recovery</h2>
    <p style="color: #6b7280; font-size: 0.9rem;">Enter your username to send a password reset link.</p>

    <div class="form-group" style="text-align: left; margin-top: 20px;">
        <label>Username</label>
        <input type="text" id="usernameInput" class="form-control" value="admin" placeholder="e.g., admin">
    </div>

    <div id="emailPreviewBox" style="display: none;">
        <p style="font-size: 0.85rem; color: #374151; margin-bottom: 5px;">Configured recovery email:</p>
        <div id="maskedEmailText" class="masked-badge">Loading...</div>
    </div>

    <button id="sendBtn" class="btn btn-primary" style="width: 100%; margin-top: 15px;">
        📩 Send Reset Link
    </button>

    <div id="statusMsg" style="margin-top: 15px; font-size: 0.85rem;"></div>

    <a href="index.html" style="display: inline-block; margin-top: 20px; color: #2563eb; text-decoration: none; font-size: 0.85rem;">← Back to Login</a>
</div>

<script>
    const usernameInput = document.getElementById('usernameInput');
    const emailPreviewBox = document.getElementById('emailPreviewBox');
    const maskedEmailText = document.getElementById('maskedEmailText');
    const sendBtn = document.getElementById('sendBtn');
    const statusMsg = document.getElementById('statusMsg');

    // Fetch and display masked email dynamically on input
    async function checkMaskedEmail() {
        const username = usernameInput.value.trim();
        if (!username) return;

        try {
            const res = await fetch(`/api/forgot_password.php?username=${encodeURIComponent(username)}`);
            if (res.ok) {
                const data = await res.json();
                maskedEmailText.textContent = `Send link to ${data.masked_email}`;
                sendBtn.textContent = `📩 Send link to ${data.masked_email}`;
                emailPreviewBox.style.display = 'block';
                sendBtn.disabled = false;
            } else {
                emailPreviewBox.style.display = 'none';
                sendBtn.textContent = '📩 Send Reset Link';
            }
        } catch (err) {
            console.error('Email preview error:', err);
        }
    }

    usernameInput.addEventListener('input', checkMaskedEmail);
    checkMaskedEmail(); // Initial load

    // Send Request
    sendBtn.addEventListener('click', async () => {
        sendBtn.disabled = true;
        sendBtn.textContent = 'Processing...';
        statusMsg.textContent = '';

        try {
            const res = await fetch('/api/forgot_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'request_reset',
                    username: usernameInput.value.trim()
                })
            });

            const data = await res.json();

            if (res.ok) {
                statusMsg.style.color = '#059669';
                statusMsg.innerHTML = `✅ Link sent to <strong>${data.masked_email}</strong>!<br><br><small style="color: #6b7280;">Dev Mode Reset Link:<br><a href="${data.reset_link_dev}">${data.reset_link_dev}</a></small>`;
            } else {
                statusMsg.style.color = '#dc2626';
                statusMsg.textContent = `❌ ${data.error || 'Failed to send request.'}`;
            }
        } catch (err) {
            statusMsg.style.color = '#dc2626';
            statusMsg.textContent = '❌ Server connection error.';
        } finally {
            sendBtn.disabled = false;
        }
    });
</script>
</body>
</html>
